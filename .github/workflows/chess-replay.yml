name: Update Chess.com replay

on:
  workflow_dispatch:
  schedule:
    # Every six hours, UTC. GitHub may delay scheduled runs during busy periods.
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: chess-replay-profile
  cancel-in-progress: false

jobs:
  update-chess-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PGN parser
        run: python -m pip install python-chess==1.999

      - name: Generate animated replay of kirlur's latest completed game
        env:
          CHESSCOM_USER: kirlur
        run: python scripts/chess_replay.py

      - name: Commit only when replay or game metadata changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/chess/last-game.svg assets/chess/last-game.json
          if git diff --cached --quiet; then
            echo "No new Chess.com game: nothing to commit."
          else
            git commit -m "chore(profile): refresh animated Chess.com replay"
            git push
          fi
